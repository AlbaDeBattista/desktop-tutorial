<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Per Angelo</title>
<link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0dfdb; --pink:#6b6f2d; --pink-l:#7d823a; --pink-d:#4f5321; --ink:#9b0047; --cream:#f3e7c9; --paper:#f7f0dd; --red:#7d1d2b;
  --shadow:rgba(40,0,20,.5);
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .1  0 0 0 0 .15  0 0 0 .55 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(120% 90% at 50% 25%,#b00a56,#9b0047 45%,#6e0033);
  font-family:"Homemade Apple","Segoe Script","Bradley Hand",cursive;color:var(--cream)}
main{display:flex;flex-direction:column;align-items:center;gap:2.8rem;width:100%;padding:1rem}
.env{position:relative;width:min(86vw,440px);aspect-ratio:4/3;margin-top:calc(min(86vw,440px)*.42);
  filter:drop-shadow(0 18px 18px var(--shadow));perspective:1200px}
.env>*{position:absolute;left:0;width:100%}
.back{top:0;height:100%;background:var(--pink-d);border-radius:3px}
.paper{left:5%!important;width:90%!important;top:5%;height:92%;background:var(--paper);z-index:2;
  border-radius:2px;display:grid;place-items:center;text-align:center;padding:1rem;
  transition:transform 1s cubic-bezier(.3,.7,.2,1) .55s;box-shadow:0 1px 5px rgba(80,30,40,.2)}
.paper p{margin:0;color:var(--ink);font-size:clamp(.8rem,3.2vw,1.05rem);line-height:1.7}
.paper hr{border:0;border-top:1px solid var(--ink);width:70%;margin:.7rem auto}
.front{top:0;height:100%;z-index:3;background:linear-gradient(160deg,var(--pink-l),var(--pink));
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:3px}
.front::after,.flap::after{content:"";position:absolute;inset:0;background:var(--noise);mix-blend-mode:multiply;opacity:.55}
.front::before{content:"";position:absolute;inset:0;
  background:linear-gradient(to right,rgba(0,0,0,.18),transparent 30%,transparent 70%,rgba(0,0,0,.18))}
.flap{top:0;height:56%;z-index:4;transform-origin:top;background:linear-gradient(var(--pink-l),var(--pink));
  clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .6s ease-in-out,z-index 0s .3s}
.addr{z-index:5;left:0;top:76%;width:100%;text-align:center;font-size:clamp(.8rem,3.4vw,1.1rem);color:var(--cream);transform:rotate(-3deg);pointer-events:none}
.stamp{z-index:5;left:auto;right:6%;top:34%;width:15%;aspect-ratio:.85;background:#fbf8f1;padding:7%;
  transform:rotate(9deg);box-shadow:0 1px 4px rgba(80,30,40,.35);pointer-events:none;
  -webkit-mask:radial-gradient(circle 3px at 50% 0,#0000 98%,#000) top/9px 51% repeat-x,
   radial-gradient(circle 3px at 50% 100%,#0000 98%,#000) bottom/9px 51% repeat-x;mask-composite:add}
.stamp i{display:block;width:100%;height:100%;background:
  radial-gradient(circle at 30% 35%,#f2f2f2 0 14%,transparent 15%),radial-gradient(circle at 65% 30%,#e0e0e0 0 16%,transparent 17%),
  radial-gradient(circle at 50% 68%,#fafafa 0 18%,transparent 19%),radial-gradient(circle at 20% 75%,#cfcfcf 0 12%,transparent 13%),
  radial-gradient(circle at 80% 72%,#ededed 0 13%,transparent 14%),#2b2b2b}
.bow{z-index:5;left:auto;right:9%;top:63%;width:9%;pointer-events:none}
.seal{z-index:5;left:50%;top:56%;transform:translate(-50%,-50%);width:clamp(3rem,13vw,4.4rem);aspect-ratio:1;
  border-radius:50%;display:grid;place-items:center;color:#6e4f10;pointer-events:none;
  font-size:clamp(1.3rem,6vw,2rem);text-shadow:0 1px 0 rgba(255,240,190,.75),0 -1px 0 rgba(90,60,5,.35);
  background:radial-gradient(circle at 35% 30%,#f3d98a,#d1a640 55%,#a97e24);
  box-shadow:0 3px 7px rgba(40,25,0,.5),inset 0 0 0 4px rgba(150,105,20,.45),inset 0 0 0 5px rgba(255,236,170,.4);
  transition:opacity .3s,transform .4s}
.seal svg{width:56%;filter:drop-shadow(0 1px 0 rgba(255,240,190,.75))}
.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.5)}
.open .flap{transform:rotateX(180deg);z-index:1;background:var(--pink-d)}
.open .paper{transform:translateY(-42%)}
.hit{z-index:7;inset:0;height:100%;background:none;border:0;cursor:pointer;padding:0}
.hit:focus-visible,.pbtn:focus-visible{outline:2px solid var(--red);outline-offset:6px}
.pbtn{z-index:8;left:5%!important;width:90%!important;top:-34%;height:92%;background:none;border:0;cursor:pointer;display:none}
.open .pbtn{display:block}
.open .hit{display:none}
.hint{margin:0;font-size:.95rem;text-align:center}
.viewer{position:fixed;inset:0;z-index:10;background:rgba(60,0,30,.88);display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 1rem) 1rem calc(env(safe-area-inset-bottom,0px) + 1rem)}
.viewer.show{display:flex}
.bar{display:flex;justify-content:flex-end;padding-bottom:.6rem}
.viewer button{font:inherit;font-size:.9rem;padding:.4rem 1.1rem;border:1px solid var(--paper);background:none;color:var(--paper);cursor:pointer;border-radius:2px}
.viewer iframe{flex:1;width:100%;max-width:900px;margin:0 auto;border:0;background:#fff;border-radius:2px}
.empty{flex:1;max-width:600px;margin:0 auto;display:grid;place-items:center;text-align:center;color:var(--paper);font-size:1.1rem;padding:2rem}
@media (prefers-reduced-motion:reduce){.paper,.flap,.seal{transition-duration:.01s;transition-delay:0s}}
.seal{background:none!important;box-shadow:none!important;border-radius:0!important;aspect-ratio:360/460!important;width:clamp(3.2rem,14vw,4.8rem)!important;display:block!important}
.seal img{display:block;width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(30,0,10,.5))}

  n.id='slot';slot.replaceWith(n);slot=n;viewer.classList.add('show');
});
document.getElementById('close').addEventListener('click',function(){viewer.classList.remove('show')});
document.addEventListener('keydown',function(e){if(e.key==='Escape')viewer.classList.remove('show')});
</script>
</body>
